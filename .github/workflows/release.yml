name: Release

# Push a tag matching the integration version, e.g.:
#   git tag v2026.11.2 && git push origin v2026.11.2
# or run the workflow manually with the version to release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match manifest.json), e.g. 2026.11.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          MANIFEST=$(jq -r .version custom_components/satel_integra/manifest.json)
          CARD=$(sed -n 's/^const CARD_VERSION = "\(.*\)";/\1/p' custom_components/satel_integra/www/satel-alarm-card.js)
          echo "Release: $VERSION, manifest: $MANIFEST, card: $CARD"
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::Version $VERSION does not match manifest.json ($MANIFEST)"
            exit 1
          fi
          if [ "$VERSION" != "$CARD" ]; then
            echo "::warning::Card version ($CARD) differs from the release version"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate translations and services
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('custom_components/satel_integra/**/*.json', recursive=True)]"
          python3 -c "import yaml; yaml.safe_load(open('custom_components/satel_integra/services.yaml'))"
          node --check custom_components/satel_integra/www/satel-alarm-card.js

      - name: Build zip
        run: |
          cd custom_components/satel_integra
          find . -name __pycache__ -prune -exec rm -rf {} +
          zip -r "$GITHUB_WORKSPACE/satel_integra.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: satel_integra.zip
